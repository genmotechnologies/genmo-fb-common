# XC-03: secret scan rules for genmo-fb-common (used by .github/workflows/security.yml).
# gitleaks' default rules: this library holds no keys, passwords or
# tokens, so anything the scan finds is a real finding. The one allowance is a value that
# starts with "test-only-" (a test's made-up idempotency key, say). Never put a real secret
# in such a value, and never widen this pattern to hide a finding.

title = "genmo-fb-common secret scan"

[extend]
useDefault = true

[allowlist]
description = "Plainly fake test values, not secrets"
regexes = [
  '''^test-only-[a-z0-9-]+$''',
]
