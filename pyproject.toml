[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "genmo-fb-common"
version = "1.0.0"
description = "Shared library for GenMo Family Banking platform"
readme = "README.md"
license = {text = "Proprietary"}
requires-python = ">=3.11"
authors = [
    {name = "GenMo Engineering Team", email = "luqman@genmotech.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Framework :: Django :: 5.0",
]

dependencies = [
    "Django>=5.0,<6.0",
    "djangorestframework>=3.14,<4.0",
    "celery>=5.3,<6.0",
    "redis>=5.0,<6.0",
    "pika>=1.3,<2.0",
    "httpx>=0.25,<1.0",
    "structlog>=23.0,<24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-django>=4.5",
    "pytest-cov>=4.0",
    "factory-boy>=3.3",
    "ruff>=0.1",
    "black>=23.0",
    "isort>=5.12",
]

[project.urls]
Repository = "https://github.com/genmotechnologies/genmo-fb-common"

[tool.setuptools.packages.find]
where = ["."]
include = ["genmo_fb_common*"]

[tool.black]
line-length = 88
target-version = ['py311']

[tool.isort]
profile = "black"
line_length = 88

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
python_files = "test_*.py"
addopts = "-v --tb=short"
pythonpath = ["."]